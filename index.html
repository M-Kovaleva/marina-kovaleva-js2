<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Social media application for sharing posts, connecting with friends, and building community. Built with Vite and Tailwind CSS." />
  <title>Social media application</title>
  <link rel="stylesheet" href="/src/css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-page-light dark:bg-page-dark font-sans text-stone-900 dark:text-stone-100 transition-colors duration-200">
  
  <!-- Navbar -->
  <nav aria-label="Main navigation" class="sticky top-0 z-50 bg-white dark:bg-stone-800 border-b border-transparent dark:border-stone-700 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <!-- Logo -->
      <a href="/" data-link aria-label="Social App - Home" class="text-xl font-bold text-stone-900 dark:text-white hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Social App</a>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex items-center gap-6" role="menubar">
        <li><a href="/" data-link role="menuitem" class="nav-link">Home</a></li>
        <li><a href="/profile" data-link role="menuitem" class="nav-link">Profile</a></li>
        <li><a href="/login" data-link role="menuitem" id="auth-link" class="nav-link">Login</a></li>
        <li><a href="/create" data-link role="menuitem" class="btn-outline">New Post</a></li>
        <li>
          <button id="theme-toggle" class="btn-theme" aria-label="Toggle dark mode">
            <span class="hidden dark:inline">☀</span>
            <span class="inline dark:hidden">☾</span>
          </button>
        </li>
      </ul>

      <!-- Mobile Actions: humburger menu and New Post button -->
      <div class="md:hidden flex items-center gap-3">
        <a href="/create" data-link class="btn-outline text-sm py-1.5 px-3">New Post</a>
        <button id="mobile-menu-btn" class="flex items-center justify-center text-stone-900 dark:text-white hover:bg-stone-200 dark:hover:bg-stone-700 rounded-lg transition-colors" aria-label="Toggle menu">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Menu Overlay -->
    <div role="menu" id="mobile-menu" class="md:hidden fixed inset-x-0 top-14 bottom-0 bg-white dark:bg-stone-800 z-40 hidden flex-col items-center justify-start pt-16 gap-6 transition-colors duration-200">
      <a href="/" data-link role="menuitem" class="mobile-link nav-link">Home</a>
      <a href="/profile" data-link role="menuitem" class="mobile-link nav-link">Profile</a>
      <a href="/login" data-link role="menuitem" id="auth-link-mobile" class="mobile-link nav-link">Login</a>
      <button id="theme-toggle-mobile" class="btn-theme" aria-label="Toggle dark mode">
        <span class="hidden dark:inline">☀</span>
        <span class="inline dark:hidden">☾</span>
      </button>
    </div>
  </nav>

  <!-- Main app -->
  <main id="app" class="flex-1 py-8 px-4"></main>

  <!-- Footer -->
  <footer class="bg-white dark:bg-stone-800 border-t border-transparent dark:border-stone-700 py-4 text-center transition-colors duration-200">
    <p class="text-stone-600 dark:text-stone-400 m-0">&copy; Social media application 2025</p>
  </footer>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
