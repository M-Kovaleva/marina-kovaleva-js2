<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Social media application</title>
  <link rel="stylesheet" href="/src/css/tailwind.css" />
</head>
<body class="min-h-screen flex flex-col bg-page-light dark:bg-page-dark font-sans text-stone-900 dark:text-stone-100 transition-colors duration-200">
  
  <!-- NAVBAR -->
  <nav class="sticky top-0 z-50 bg-white dark:bg-stone-800 border-b border-transparent dark:border-stone-700 transition-colors duration-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <!-- Logo -->
      <a href="/" data-link class="text-xl font-bold text-stone-900 dark:text-white hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Social App</a>

      <!-- Desktop Menu -->
      <ul class="hidden md:flex items-center gap-6">
        <li><a href="/" data-link class="text-stone-700 dark:text-stone-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Home</a></li>
        <li><a href="/profile" data-link class="text-stone-700 dark:text-stone-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Profile</a></li>
        <li><a href="/login" data-link id="auth-link" class="text-stone-700 dark:text-stone-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Login</a></li>
        <li><a href="/create" data-link class="px-4 py-2 border-2 border-brand-600 text-brand-600 dark:text-brand-400 dark:border-brand-400 rounded-lg font-semibold hover:bg-brand-600 hover:text-white dark:hover:bg-brand-500 dark:hover:text-white transition-all duration-200">New Post</a></li>
        <li>
          <button id="theme-toggle" class="w-9 h-9 flex items-center justify-center rounded-lg bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 dark:hover:bg-stone-600 text-stone-700 dark:text-stone-200 transition-colors" aria-label="Toggle dark mode">
            <span class="hidden dark:inline">☀</span>
            <span class="inline dark:hidden">☾</span>
          </button>
        </li>
      </ul>

      <!-- Mobile Hamburger -->
      <button id="mobile-menu-btn" class="md:hidden p-2 text-2xl text-stone-900 dark:text-white hover:bg-stone-200 dark:hover:bg-stone-700 rounded-lg transition-colors" aria-label="Toggle menu">☰</button>
    </div>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-x-0 top-[56px] bottom-0 bg-white dark:bg-stone-900 z-40 hidden flex-col items-center justify-center gap-6 transition-colors duration-200">
      <a href="/" data-link class="mobile-link text-2xl font-semibold text-stone-900 dark:text-white hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Home</a>
      <a href="/profile" data-link class="mobile-link text-2xl font-semibold text-stone-700 dark:text-stone-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Profile</a>
      <a href="/login" data-link class="mobile-link text-2xl font-semibold text-stone-700 dark:text-stone-300 hover:text-brand-600 dark:hover:text-brand-400 transition-colors">Login</a>
      <a href="/create" data-link class="mobile-link text-xl px-6 py-3 border-2 border-brand-600 text-brand-600 dark:text-brand-400 dark:border-brand-400 rounded-lg font-semibold hover:bg-brand-600 hover:text-white dark:hover:bg-brand-500 transition-all">New Post</a>
      <button id="theme-toggle-mobile" class="w-12 h-12 flex items-center justify-center rounded-lg bg-stone-200 dark:bg-stone-700 hover:bg-stone-300 dark:hover:bg-stone-600 text-stone-700 dark:text-stone-200 text-xl transition-colors" aria-label="Toggle dark mode">
        <span class="hidden dark:inline">☀</span>
        <span class="inline dark:hidden">☾</span>
      </button>
    </div>
  </nav>

  <!-- MAIN APP -->
  <main id="app" class="flex-1 py-8 px-4"></main>

  <!-- FOOTER -->
  <footer class="bg-white dark:bg-stone-800 border-t border-transparent dark:border-stone-700 py-4 text-center transition-colors duration-200">
    <p class="text-stone-600 dark:text-stone-400 m-0">&copy; Social media application 2025</p>
  </footer>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
